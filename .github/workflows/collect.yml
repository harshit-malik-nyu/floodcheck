name: collect
on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'regulations.gov API key (passed at run time, never stored)'
        required: true
      docket:
        description: 'docket id, or blank to discover'
        required: false
        default: ''
      text_sample:
        description: 'how many comments to pull text for'
        required: false
        default: '300'
permissions:
  contents: write
concurrency:
  group: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect
        env:
          REGULATIONS_API_KEY: ${{ inputs.api_key }}
        run: |
          mkdir -p evidence
          python scripts/collect.py \
            --docket "${{ inputs.docket }}" \
            --text-sample "${{ inputs.text_sample }}" \
            2>&1 | tee evidence/collect-run.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Collection'; echo; echo '```';
            tail -30 evidence/collect-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: collection run [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }
