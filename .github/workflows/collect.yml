name: collect
on:
  push:
    branches: [main]
    paths: ['.collect-trigger']
  workflow_dispatch:
    inputs:
      api_key:
        description: 'regulations.gov API key (passed at run time, never stored)'
        required: true
      docket:
        description: 'docket id, or blank to discover'
        required: false
        default: ''
      text_sample:
        description: 'how many comments to pull text for'
        required: false
        default: '300'
permissions:
  contents: write
concurrency:
  group: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect
        env:
          # Either route works: paste the key when running manually, or store
          # it once as a repository secret and every later run is automatic.
          # It is never written into the repository by either path.
          REGULATIONS_API_KEY: ${{ inputs.api_key || secrets.REGULATIONS_API_KEY }}
        run: |
          mkdir -p evidence
          # Defaults inline. A push to .collect-trigger supplies no inputs at
          # all, so every one of them arrives as an empty string — the first
          # run died on `--text-sample ''` before making a single API call.
          python scripts/collect.py \
            --docket "${{ inputs.docket || '' }}" \
            --text-sample "${{ inputs.text_sample || '300' }}" \
            2>&1 | tee evidence/collect-run.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Collection'; echo; echo '```';
            tail -30 evidence/collect-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: collection run [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }
